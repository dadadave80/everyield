[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 1_000_000
ffi = true                      # BaseDeploy string-cut path (AaveV3Adapter has no exportSelectors)
fs_permissions = [{ access = "read", path = "out" }]

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
