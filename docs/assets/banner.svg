<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1280 320" role="img" aria-label="Everyield — the savings account that doesn't know what a chain is">
  <!-- self-contained deep-forest ground: reads the same on GitHub light or dark pages -->
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="#0b1610"/>
  <ellipse cx="360" cy="80" rx="540" ry="250" fill="#4ec491" fill-opacity="0.07"/>
  <rect x="1.5" y="1.5" width="1277" height="317" rx="23.5" fill="none" stroke="#2a4a39" stroke-opacity="0.7"/>

  <!-- yield-curve motif doubling as the cross-chain stage rail -->
  <path d="M812 246 C855 236 897 224 940 206 C983 188 1025 173 1068 156 C1111 139 1153 118 1196 96 L1196 260 L812 260 Z" fill="#4ec491" fill-opacity="0.10"/>
  <path d="M812 246 C855 236 897 224 940 206 C983 188 1025 173 1068 156 C1111 139 1153 118 1196 96" fill="none" stroke="#4ec491" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
  <circle cx="812" cy="246" r="6" fill="#3fae7f"/>
  <circle cx="940" cy="206" r="6" fill="#4ec491"/>
  <circle cx="1068" cy="156" r="6" fill="#4ec491"/>
  <circle cx="1196" cy="96" r="9" fill="none" stroke="#64d8a4" stroke-width="2.5" stroke-opacity="0.55"/>
  <circle cx="1196" cy="96" r="6.5" fill="#64d8a4"/>

  <!-- leaf / rising-stem glyph -->
  <g transform="translate(70 96) scale(4.4)">
    <path d="M12 21.5V8" fill="none" stroke="#4ec491" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M12 12C12 8.5 9 6 5.5 6C5.5 9.5 8.5 12 12 12Z" fill="#3fae7f"/>
    <path d="M12 10.5C12 6.5 15.4 3.5 19 3.5C19 7.5 15.6 10.5 12 10.5Z" fill="#64d8a4"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="176" y="160" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="88" font-weight="500" letter-spacing="-1" fill="#f0eee7">Everyield</text>
  <text x="180" y="208" font-family="'Hanken Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="0.2" fill="#a7dcc4">The savings account that doesn&#8217;t know what a chain is.</text>
  <text x="181" y="246" font-family="'Hanken Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#6f9a86">EARNS EVERYWHERE AT ONCE &#183; WITHDRAW ANYTIME</text>
</svg>
